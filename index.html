<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Giftlink Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #5865F2;
            text-align: center;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background-color: #2b2d31;
            color: white;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .button:hover {
            background-color: #4752C4;
        }
        .button.stop {
            background-color: #DA373C;
        }
        .button.stop:hover {
            background-color: #A02025;
        }
        .button.start {
            background-color: #3BA55C;
        }
        .button.start:hover {
            background-color: #2E8647;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Giftlink Checker</h1>
        <p>This tool generates random Discord gift links, checks their validity, and sends valid ones to a predefined webhook.</p>
        
        <div class="controls">
            <button class="button start" onclick="startScanning()" id="startButton">Start</button>
            <button class="button stop" onclick="stopScanning()" id="stopButton" disabled>Stop</button>
        </div>
        
        <div id="status" class="status info">Ready to scan. Click "Start" to begin.</div>
        
        <h3>Logs:</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        // Configuration
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1535632574624432208/5HY97CzhCjZ_dpd3Tv2uLtkcrsoNFpr3XNJqLDQ9_FIaBUENAuE89TaA4m-wkRWzwEj3";
        const DISCORD_GIFT_LINK_REGEX = /(https?:\/\/)?(discord\.gift|discordapp\.com\/gift)\/[A-Za-z0-9]+/g;
        
        // Rate limiting: Minimum delay between webhook sends (in milliseconds)
        const RATE_LIMIT_DELAY = 2000;
        
        // Track sent links to avoid duplicates
        const sentLinks = new Set();
        
        // Scanning state
        let isScanning = false;
        let scanInterval = null;
        
        // Log messages to the UI and console
        function logMessage(message, type = "info") {
            const logElement = document.getElementById("log");
            const timestamp = new Date().toISOString();
            const formattedMessage = `[${timestamp}] ${message}`;
            
            // Add to UI log
            const logEntry = document.createElement("div");
            logEntry.textContent = formattedMessage;
            logEntry.className = type;
            logElement.appendChild(logEntry);
            
            // Scroll to bottom
            logElement.scrollTop = logElement.scrollHeight;
            
            // Add to console
            switch (type) {
                case "success":
                    console.log(`%c${formattedMessage}`, "color: green");
                    break;
                case "error":
                    console.error(`%c${formattedMessage}`, "color: red");
                    break;
                default:
                    console.log(`%c${formattedMessage}`, "color: blue");
            }
        }
        
        // Update status message
        function updateStatus(message, type = "info") {
            const statusElement = document.getElementById("status");
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
        }
        
        // Generate a random Discord gift link
        function generateRandomGiftLink() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const length = 16; // Discord gift links are typically 16 characters
            let result = '';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return `https://discord.gift/${result}`;
        }
        
        // Send a link to the webhook
        async function sendToWebhook(link) {
            try {
                const payload = {
                    content: `🎁 **Discord Gift Link Found:** ${link}`,
                    embeds: [
                        {
                            title: "Gift Link Detected",
                            description: `A valid Discord gift link was found: [${link}](${link})`,
                            color: 0x5865F2,
                            fields: [
                                {
                                    name: "Link",
                                    value: link,
                                    inline: true
                                },
                                {
                                    name: "Status",
                                    value: "Valid Format",
                                    inline: true
                                }
                            ],
                            timestamp: new Date().toISOString()
                        }
                    ]
                };
                
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    logMessage(`✅ Successfully sent link to webhook: ${link}`, "success");
                    return true;
                } else {
                    logMessage(`❌ Failed to send link to webhook: ${link} (HTTP ${response.status})`, "error");
                    return false;
                }
            } catch (error) {
                logMessage(`❌ Error sending link to webhook: ${link} (${error.message})`, "error");
                return false;
            }
        }
        
        // Scan for gift links in the DOM and generate random ones
        async function scanForGiftLinks() {
            if (!isScanning) return;
            
            updateStatus("Scanning for gift links...", "info");
            
            // Generate a random gift link
            const randomLink = generateRandomGiftLink();
            logMessage(`Generated random gift link: ${randomLink}`, "info");
            
            // Check if the link matches the gift link format
            if (DISCORD_GIFT_LINK_REGEX.test(randomLink)) {
                if (!sentLinks.has(randomLink)) {
                    sentLinks.add(randomLink);
                    logMessage(`Found valid gift link: ${randomLink}`, "success");
                    await sendToWebhook(randomLink);
                } else {
                    logMessage(`⏭️ Skipping already sent link: ${randomLink}`, "info");
                }
            }
            
            // Wait before generating the next link
            await new Promise(resolve => setTimeout(resolve, RATE_LIMIT_DELAY));
        }
        
        // Start scanning
        function startScanning() {
            if (isScanning) return;
            
            isScanning = true;
            updateStatus("Scanning started. Click 'Stop' to halt.", "success");
            logMessage("Scanning started.", "success");
            
            // Enable/disable buttons
            document.getElementById("startButton").disabled = true;
            document.getElementById("stopButton").disabled = false;
            
            // Start the scanning loop
            scanInterval = setInterval(scanForGiftLinks, RATE_LIMIT_DELAY);
            
            // Start the first scan immediately
            scanForGiftLinks();
        }
        
        // Stop scanning
        function stopScanning() {
            if (!isScanning) return;
            
            isScanning = false;
            updateStatus("Scanning stopped.", "error");
            logMessage("Scanning stopped.", "error");
            
            // Enable/disable buttons
            document.getElementById("startButton").disabled = false;
            document.getElementById("stopButton").disabled = true;
            
            // Clear the interval
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
        }
        
        // Initialize the checker
        function init() {
            logMessage("Initializing Discord Giftlink Checker...", "info");
            updateStatus("Ready to scan. Click 'Start' to begin.", "info");
        }
        
        // Start the checker when the page loads
        window.addEventListener("load", init);
        
        // Also run if the script is injected dynamically
        if (document.readyState === "complete" || document.readyState === "interactive") {
            init();
        }
    </script>
</body>
</html>
