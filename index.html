<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Discord Giftlink Checker (5 Links/Sec) ⚡</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #5865F2;
            text-align: center;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background: #2b2d31;
            color: white;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 20px auto;
            display: block;
        }
        .start {
            background: #3BA55C;
            color: white;
        }
        .stop {
            background: #DA373C;
            color: white;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Discord Giftlink Checker (5 Links/Sec) ⚡</h1>
        <p>Generates and checks Discord gift links at <strong>5 links per second</strong>.</p>

        <button class="button start" onclick="toggleScanning()" id="scanButton">Start</button>

        <div class="stats">
            <span>✅ Valid: <span id="validCount">0</span></span>
            <span>❌ Invalid: <span id="invalidCount">0</span></span>
        </div>

        <div id="status" class="status info">Ready. Click "Start" to begin.</div>

        <h3>Logs:</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        // Configuration
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1535632574624432208/5HY97CzhCjZ_dpd3Tv2uLtkcrsoNFpr3XNJqLDQ9_FIaBUENAuE89TaA4m-wkRWzwEj3";
        const DISCORD_GIFT_LINK_REGEX = /^https:\/\/discord\.gift\/[A-Za-z0-9]{16}$/;
        const LINKS_PER_SECOND = 5;
        const DELAY_MS = 1000 / LINKS_PER_SECOND; // 200ms for 5 links/sec

        // State
        let isScanning = false;
        let scanTimeout = null;
        let validCount = 0;
        let invalidCount = 0;

        // DOM Elements
        const scanButton = document.getElementById("scanButton");
        const logElement = document.getElementById("log");
        const statusElement = document.getElementById("status");

        // Pre-compute random characters for faster generation
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        const charLength = chars.length;

        // Log messages
        function log(message, type = "info") {
            const entry = document.createElement("div");
            entry.textContent = `[${new Date().toISOString()}] ${message}`;
            entry.className = type;
            logElement.appendChild(entry);
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Update status
        function updateStatus(message, type = "info") {
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
        }

        // Update stats
        function updateStats() {
            document.getElementById("validCount").textContent = validCount;
            document.getElementById("invalidCount").textContent = invalidCount;
        }

        // Generate a random gift link (optimized)
        function generateRandomGiftLink() {
            let code = '';
            for (let i = 0; i < 16; i++) {
                code += chars.charAt(Math.floor(Math.random() * charLength));
            }
            return `https://discord.gift/${code}`;
        }

        // Scan for gift links (5 per second)
        function scanForGiftLinks() {
            if (!isScanning) return;

            const link = generateRandomGiftLink();

            if (DISCORD_GIFT_LINK_REGEX.test(link)) {
                validCount++;
                log(`✅ Valid: ${link}`, "success");
                // Uncomment to send to webhook
                /*
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `🎁 **Valid Gift Link:** ${link}` })
                }).catch(() => {});
                */
            } else {
                invalidCount++;
                log(`❌ Invalid: ${link}`, "error");
            }

            updateStats();
            scanTimeout = setTimeout(scanForGiftLinks, DELAY_MS);
        }

        // Toggle scanning (Start/Stop)
        function toggleScanning() {
            if (isScanning) {
                // Stop scanning
                isScanning = false;
                clearTimeout(scanTimeout);
                updateStatus("Scanning stopped.", "error");
                scanButton.textContent = "Start";
                scanButton.className = "button start";
            } else {
                // Start scanning
                isScanning = true;
                validCount = 0;
                invalidCount = 0;
                updateStatus("Scanning at 5 links/sec...", "success");
                scanButton.textContent = "Stop";
                scanButton.className = "button stop";
                scanForGiftLinks(); // Start immediately
            }
        }

        // Initialize
        window.addEventListener("load", () => {
            log("⚡ Discord Giftlink Checker loaded. Ready to scan at 5 links/sec!", "info");
            updateStatus("Ready. Click 'Start' to begin.", "info");
        });
    </script>
</body>
</html>
